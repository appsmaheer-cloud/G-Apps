  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #f8fafc;
      --card: #ffffff;
      --sidebar: #ffffff;
      --card-border: #e2e8f0;
      --foreground: #0f172a;
      --muted-foreground: #64748b;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; line-height: 1.45; }
    .num-tabular { font-variant-numeric: tabular-nums; }
    .am-accent { color: #2D4A94; }
    .am-bg { background-color: #2D4A94; color: #ffffff; }
    .am-border-active { border-left: 3px solid #2D4A94; background: rgba(45, 74, 148, 0.08); color: #2D4A94; font-weight: 600; }
    .fm-accent { color: #0E5E63; }
    .fm-bg { background-color: #0E5E63; color: #ffffff; }
    .fm-border-active { border-left: 3px solid #0E5E63; background: rgba(14, 94, 99, 0.08); color: #0E5E63; font-weight: 600; }
    @media print {
      body > *:not(#print-modal) { display: none !important; }
      #print-modal { position: static !important; background: #fff !important; padding: 0 !important; display: block !important; }
      #print-card { max-width: 100% !important; max-height: none !important; border: none !important; box-shadow: none !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>

            Facility (FM)

      </div>

        <!-- Populated dynamically -->

      <div class="p-3 border-t border-[var(--card-border)] text-[11px] text-[var(--muted-foreground)] flex items-center justify-between">
        <span class="flex items-center gap-1.5">

          <span>Live API: 35.242 Aset</span>
        </span>

      </div>
    </aside>

        </div>

                const isAct = state.curId === it.id;
                const actCls = isFmLayer ? 'fm-border-active' : 'am-border-active';
                return `
                  <button type="button" onclick="gotoId('${it.id}')"

        <span>/</span>

        if (state.filter.kelompok && a.kelompok !== state.filter.kelompok) return false;
        if (state.filter.loc && a.loc !== state.filter.loc) return false;
        if (state.filter.kondisi !== 'ALL' && a.kondisi !== state.filter.kondisi) return false;
        if (state.filter.search) {
          const hay = `${a.kode} ${a.alias} ${a.nama} ${a.dept} ${a.section} ${a.sectionName} ${a.kelompok} ${a.loc}`.toLowerCase();

        }
        return true;

      if (state.expandedL2.has(key)) state.expandedL2.delete(key); else state.expandedL2.add(key);
      renderMain();
    }

    function applyTreeFilter(dept, section, kelompok, loc, e) {
      if (e) e.stopPropagation();
      state.filter.dept = dept || null; state.filter.section = section || null;
      state.filter.kelompok = kelompok || null; state.filter.loc = loc || null;
      renderMain();
    }

    function togglePrintSelect(kode, e) {
      if (e) e.stopPropagation();
      if (state.selectedPrintCodes.has(kode)) state.selectedPrintCodes.delete(kode); else state.selectedPrintCodes.add(kode);
      renderMain();
    }

    // =========================================================================
    // MODUL 1.2: LAPORAN HASIL VALIDASI (3-LEVEL TREE: DEPT -> SECTION -> KELOMPOK)
    // =========================================================================
    function renderModValidasi() {
      const filtered = getFilteredAssets();
      const totalHpp = filtered.reduce((s, a) => s + a.hpp, 0);
      const totalNbv = filtered.reduce((s, a) => s + a.nbv, 0);
      const totalMtc = filtered.reduce((s, a) => s + a.mtc, 0);

      const treeRows = [];
      const depts = [...new Set(PROTOTYPE_ASSETS.map(a => a.dept))];
      depts.forEach(d => {
        const dAssets = PROTOTYPE_ASSETS.filter(a => a.dept === d);
        const dSesuai = dAssets.filter(a => a.statusVerif === 'ALOKASI SESUAI').length;
        const dSelisih = dAssets.length - dSesuai;
        const isExpL1 = state.expandedL1.has(d);
        const isActiveL1 = state.filter.dept === d && !state.filter.section && !state.filter.kelompok;

        treeRows.push(`
          <tr onclick="applyTreeFilter('${esc(d)}', null, null, null, event)"

              <div class="flex items-center gap-2">
                <button type="button" onclick="event.stopPropagation(); toggleL1('${esc(d)}')"

              </div>
            </td>
            <td class="py-2 px-2.5 text-right num-tabular text-emerald-700 font-medium">${dSesuai}</td>
            <td class="py-2 px-2.5 text-right num-tabular ${dSelisih > 0 ? 'text-rose-600 font-semibold' : 'text-[var(--muted-foreground)]'}">${dSelisih || '-'}</td>
            <td class="py-2 px-2.5 text-right num-tabular font-semibold">${dAssets.length}</td>
            <td class="py-2 px-3 text-right font-mono text-[11px]">${formatRp(dAssets.reduce((s, x) => s + x.nbv, 0))}</td>
          </tr>

        if (isExpL1) {
          const sections = [...new Set(dAssets.map(a => a.section))];
          sections.forEach(sec => {
            const sAssets = dAssets.filter(a => a.section === sec);
            const secLabel = sAssets[0].sectionName;
            const sSesuai = sAssets.filter(a => a.statusVerif === 'ALOKASI SESUAI').length;
            const sSelisih = sAssets.length - sSesuai;
            const isExpL2 = state.expandedL2.has(sec);
            const isActiveL2 = state.filter.dept === d && state.filter.section === sec && !state.filter.kelompok;

            treeRows.push(`
              <tr onclick="applyTreeFilter('${esc(d)}', '${esc(sec)}', null, null, event)"

                <td class="py-1.5 pl-8 pr-3">
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="toggleL2('${esc(sec)}', event)"
                            class="w-4 h-4 rounded border border-[var(--card-border)] bg-[var(--card)] text-[10px] font-mono flex items-center justify-center cursor-pointer">${isExpL2 ? '−' : '+'}</button>

                    <span>${esc(secLabel)}</span>
                    <span class="text-[10px] text-[var(--muted-foreground)]">(Section)</span>
                  </div>

                <td class="py-1.5 px-2.5 text-right num-tabular text-xs">${sSesuai}</td>
                <td class="py-1.5 px-2.5 text-right num-tabular text-xs ${sSelisih > 0 ? 'text-rose-600 font-semibold' : 'text-[var(--muted-foreground)]'}">${sSelisih || '-'}</td>
                <td class="py-1.5 px-2.5 text-right num-tabular text-xs font-medium">${sAssets.length}</td>
                <td class="py-1.5 px-3 text-right font-mono text-[11px] text-[var(--muted-foreground)]">${formatRp(sAssets.reduce((s, x) => s + x.nbv, 0))}</td>
              </tr>
            `);

            if (isExpL2) {
              const kels = [...new Set(sAssets.map(a => a.kelompok))];
              kels.forEach(kl => {
                const kAssets = sAssets.filter(a => a.kelompok === kl);
                const kSesuai = kAssets.filter(a => a.statusVerif === 'ALOKASI SESUAI').length;
                const kSelisih = kAssets.length - kSesuai;
                const isActiveL3 = state.filter.dept === d && state.filter.section === sec && state.filter.kelompok === kl;

                treeRows.push(`
                  <tr onclick="applyTreeFilter('${esc(d)}', '${esc(sec)}', '${esc(kl)}', null, event)"
                      class="border-b border-[var(--card-border)] cursor-pointer transition text-xs ${isActiveL3 ? 'bg-[#2D4A94]/15 font-semibold' : 'hover:bg-[var(--background)]'}">
                    <td class="py-1.5 pl-14 pr-3 text-[var(--muted-foreground)]">
                      <span class="mr-1">↳</span>
                      <span class="text-[var(--foreground)] font-medium">${esc(kl)}</span>
                      <span class="text-[10px] ml-1">(Kelompok)</span>
                    </td>
                    <td class="py-1.5 px-2.5 text-right num-tabular">${kSesuai}</td>
                    <td class="py-1.5 px-2.5 text-right num-tabular ${kSelisih > 0 ? 'text-rose-600 font-semibold' : 'text-[var(--muted-foreground)]'}">${kSelisih || '-'}</td>
                    <td class="py-1.5 px-2.5 text-right num-tabular">${kAssets.length}</td>

      const activeTags = [state.filter.dept, state.filter.section, state.filter.kelompok, state.filter.loc].filter(Boolean);

        <div class="flex flex-wrap items-center justify-between gap-2">

        <!-- STRIP RINGKASAN BERSEKAT (SATU KALI TAMPIL) -->

          <div class="p-3"><div class="text-[11px] text-[var(--muted-foreground)]">Validasi 2025 / Baru</div><div class="text-base font-semibold num-tabular mt-0.5">34.793 <span class="text-xs font-normal text-amber-600">(449 Baru)</span></div></div>
          <div class="p-3"><div class="text-[11px] text-[var(--muted-foreground)]">HPP Terfilter</div><div class="text-sm font-semibold font-mono num-tabular mt-1">${formatRp(totalHpp)}</div></div>
          <div class="p-3"><div class="text-[11px] text-[var(--muted-foreground)]">NBV Terfilter</div><div class="text-sm font-semibold font-mono num-tabular am-accent mt-1">${formatRp(totalNbv)}</div></div>
          <div class="p-3"><div class="text-[11px] text-[var(--muted-foreground)]">Total Maintenance</div><div class="text-sm font-semibold font-mono num-tabular fm-accent mt-1">${formatRp(totalMtc)}</div></div>
        </div>

        <!-- MATRIKS HIERARKI (DEPT -> SECTION -> KELOMPOK) -->
        <div class="border border-[var(--card-border)] rounded bg-[var(--card)] overflow-hidden">
          <div class="px-3 py-2 border-b border-[var(--card-border)] flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2">
              <span class="font-semibold">Matriks Audit: Departemen ➔ Section ➔ Kelompok</span>
              ${activeTags.length > 0 ? `<span class="px-2 py-0.5 rounded bg-[#2D4A94]/10 am-accent font-medium text-[11px]">${esc(activeTags.join(' ▸ '))}</span><button type="button" onclick="applyTreeFilter(null,null,null,null,event)" class="text-[11px] underline text-[var(--muted-foreground)] cursor-pointer">Reset</button>` : ''}
            </div>
            <span class="text-[11px] text-[var(--muted-foreground)]">Zero horizontal scroll &bull; Sticky header aktif</span>
          </div>
          <div class="max-h-52 overflow-y-auto overflow-x-hidden">
            <table class="w-full text-left border-collapse table-fixed text-xs">
              <colgroup><col style="width:48%" /><col style="width:11%" /><col style="width:11%" /><col style="width:11%" /><col style="width:19%" /></colgroup>
              <thead class="sticky top-0 z-10 bg-slate-50 border-b border-[var(--card-border)] text-[10px] uppercase tracking-wider text-[var(--muted-foreground)]">
                <tr><th class="py-2 px-3">Departemen ▸ Section ▸ Kelompok</th><th class="py-2 px-2.5 text-right">Sesuai</th><th class="py-2 px-2.5 text-right">Selisih</th><th class="py-2 px-2.5 text-right">Total</th><th class="py-2 px-3 text-right">Nilai Buku (NBV)</th></tr>
              </thead>
              <tbody>${treeRows.join('')}</tbody>
            </table>
          </div>
        </div>

        <!-- TABEL DETAIL UNIT (100% FIT-TO-SCREEN, ZERO HORIZONTAL SCROLL, FROZEN HEADER) -->
        <div class="border border-[var(--card-border)] rounded bg-[var(--card)] overflow-hidden">
          <div class="px-3 py-2 border-b border-[var(--card-border)] flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2">
              <span class="font-semibold">Rincian Unit Terfilter (${filtered.length} Unit Sampel)</span>
              ${state.selectedPrintCodes.size > 0 ? `<button type="button" onclick="openPrintSummary()" class="px-2 py-0.5 rounded bg-[#2D4A94] text-white text-[11px] font-medium cursor-pointer">Cetak Detail (${state.selectedPrintCodes.size} Unit)</button>` : ''}
            </div>
            <span class="text-[11px] text-[var(--muted-foreground)]">Klik unit untuk Dossier &amp; Transaksi Mutasi</span>
          </div>
          <div class="max-h-64 overflow-y-auto overflow-x-hidden">
            <table class="w-full text-left border-collapse table-fixed text-xs">
              <colgroup><col style="width:19%" /><col style="width:28%" /><col style="width:17%" /><col style="width:12%" /><col style="width:16%" /><col style="width:8%" /></colgroup>
              <thead class="sticky top-0 z-10 bg-slate-50 border-b border-[var(--card-border)] text-[10px] uppercase tracking-wider text-[var(--muted-foreground)]">
                <tr><th class="py-2 px-3">Unit, Dept &amp; Site</th><th class="py-2 px-2.5">Nama Aset &amp; Kategori</th><th class="py-2 px-2.5">Status &amp; Verifikasi</th><th class="py-2 px-2 text-right">Perolehan &amp; Umur</th><th class="py-2 px-2.5 text-right">NBV &amp; MTC</th><th class="py-2 px-2 text-center">Panel</th></tr>
              </thead>
              <tbody class="divide-y divide-[var(--card-border)]">
                ${filtered.map(a => {
                  const dot = a.kondisi === 'Good Condition' ? 'bg-emerald-500' : (a.kondisi === 'Repair' ? 'bg-amber-500' : 'bg-rose-500');
                  return `
                    <tr onclick="openDrawer('${esc(a.kode)}')" class="cursor-pointer transition ${state.drawerAssetCode === a.kode ? 'bg-[#2D4A94]/10' : 'hover:bg-[var(--background)]'}">
                      <td class="py-2 px-3 align-top">
                        <div class="flex items-start gap-1.5">
                          <input type="checkbox" ${state.selectedPrintCodes.has(a.kode) ? 'checked' : ''} onclick="togglePrintSelect('${esc(a.kode)}', event)" class="mt-0.5 cursor-pointer shrink-0" />
                          <div class="min-w-0">
                            <div class="font-mono font-semibold text-[11px] am-accent truncate">${esc(a.kode)}</div>
                            <div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">${esc(a.loc)} &bull; ${esc(a.dept)} (${esc(a.section)})</div>
                          </div>
                        </div>
                      </td>
                      <td class="py-2 px-2.5 align-top"><div class="font-medium leading-snug">${esc(a.nama)}</div><div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">${esc(a.kelompok)} &bull; ${esc(a.subKat)}</div></td>
                      <td class="py-2 px-2.5 align-top"><div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ${dot}"></span><span class="font-medium">${esc(a.kondisi)}</span></div><div class="text-[10px] ${a.statusVerif === 'ALOKASI SESUAI' ? 'text-[var(--muted-foreground)]' : 'text-rose-600 font-medium'} mt-0.5">${esc(a.statusVerif)}</div></td>
                      <td class="py-2 px-2 text-right align-top font-mono"><div>${esc(a.tglPerolehan)}</div><div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">${a.umur}/${a.stdUmur} thn</div></td>
                      <td class="py-2 px-2.5 text-right align-top font-mono"><div class="font-semibold">${formatRp(a.nbv)}</div><div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">MTC: ${formatRp(a.mtc)}</div></td>
                      <td class="py-2 px-2 text-center align-top"><span class="text-[11px] font-medium am-accent">Buka &rarr;</span></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // =========================================================================

    function renderMain() {

        main.innerHTML = renderModValidasi();
      } else if (state.curId === 'mod-hunian' || state.curId === 'mod-penghuni' || state.curId === 'mod-inspeksi') {
        main.innerHTML = renderModHunian();
      } else {
        main.innerHTML = renderModValidasi();
      }
    }

    // =========================================================================
    // SLIDE-OVER DOSSIER & 5 AKSI SIKLUS UNIT
    // =========================================================================
    function openDrawer(kode, tab) {
      state.drawerAssetCode = kode;
      state.drawerTab = tab || state.drawerTab || 'spec';
      document.getElementById('drawer-overlay').classList.remove('hidden');
      document.getElementById('unit-drawer').classList.remove('translate-x-full');
      renderDrawer();
      renderMain();
    }

    function closeDrawer() {
      state.drawerAssetCode = null;
      document.getElementById('drawer-overlay').classList.add('hidden');
      document.getElementById('unit-drawer').classList.add('translate-x-full');
      renderMain();
    }

    function renderDrawer() {
      const a = PROTOTYPE_ASSETS.find(x => x.kode === state.drawerAssetCode);
      if (!a) return;
      const ratioPct = a.hpp > 0 ? ((a.mtc / a.hpp) * 100).toFixed(1) : '0.0';
      document.getElementById('drawer-content').innerHTML = `
        <div class="p-4 border-b border-[var(--card-border)] flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-2 font-mono text-xs">
              <span class="font-semibold am-accent">${esc(a.kode)}</span>
              <span class="text-[var(--muted-foreground)]">(${esc(a.alias)})</span>
            </div>
            <h2 class="text-sm font-semibold mt-1 leading-snug">${esc(a.nama)}</h2>
            <p class="text-[11px] text-[var(--muted-foreground)] mt-0.5">${esc(a.dept)} ▸ ${esc(a.section)} (${esc(a.sectionName)}) &bull; ${esc(a.lokasiName)}</p>
          </div>
          <button type="button" onclick="closeDrawer()" class="px-2 py-1 border border-[var(--card-border)] rounded text-xs cursor-pointer">✕</button>
        </div>

        <!-- 5 AKSI SIKLUS + SPESIFIKASI & PART BKB DALAM 1 PANEL -->
        <div class="px-4 pt-2 border-b border-[var(--card-border)] flex items-center gap-3 text-[11px] overflow-x-auto">
          ${[
            ['spec', '1. Detail & Finansial'],
            ['parts', `2. Part BKB (${a.parts.length})`],
            ['mutasi', '3. Mutasi Dept/Lokasi'],
            ['kondisi', '4. Kondisi & Disposal']
          ].map(([k, lbl]) => `
            <button type="button" onclick="state.drawerTab='${k}'; renderDrawer()"
                    class="pb-2 whitespace-nowrap cursor-pointer ${state.drawerTab === k ? 'border-b-2 border-[#2D4A94] font-semibold am-accent' : 'text-[var(--muted-foreground)]'}">${lbl}</button>
          `).join('')}
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
          ${state.drawerTab === 'spec' ? `
            <div class="grid grid-cols-2 gap-2.5">
              <div class="p-2.5 rounded border border-[var(--card-border)]"><div class="text-[10px] text-[var(--muted-foreground)]">Tanggal Perolehan</div><div class="font-mono font-semibold mt-0.5">${esc(a.tglPerolehan)}</div></div>
              <div class="p-2.5 rounded border border-[var(--card-border)]"><div class="text-[10px] text-[var(--muted-foreground)]">Umur s/d Hari Ini</div><div class="font-mono font-semibold mt-0.5">${a.umur} Tahun (Std: ${a.stdUmur} Thn)</div></div>
              <div class="p-2.5 rounded border border-[var(--card-border)]"><div class="text-[10px] text-[var(--muted-foreground)]">Nilai Perolehan (HPP)</div><div class="font-mono font-semibold mt-0.5">${formatRp(a.hpp)}</div></div>
              <div class="p-2.5 rounded border border-[var(--card-border)]"><div class="text-[10px] text-[var(--muted-foreground)]">Nilai Buku (NBV)</div><div class="font-mono font-semibold am-accent mt-0.5">${formatRp(a.nbv)}</div></div>
              <div class="p-2.5 rounded border border-[var(--card-border)] col-span-2 bg-teal-50/40">
                <div class="text-[10px] fm-accent font-medium">Total Maintenance (BKB)</div>
                <div class="font-mono font-semibold fm-accent mt-0.5">${formatRp(a.mtc)} <span class="text-[10px] font-normal text-[var(--muted-foreground)]">(${a.txCount} BKB &bull; ${ratioPct}% dari HPP)</span></div>
              </div>
            </div>
            <div class="border border-[var(--card-border)] rounded p-3 space-y-1.5">
              <div class="font-semibold">Klasifikasi Resmi Live API</div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Department / Section</span><span class="font-medium">${esc(a.dept)} / ${esc(a.section)} (${esc(a.sectionName)})</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Kelompok / Kategori</span><span>${esc(a.kelompok)} / ${esc(a.kategori)}</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Sub Kategori</span><span>${esc(a.subKat)}</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Location Site</span><span>${esc(a.lokasiName)}</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Status Verifikasi</span><span>${esc(a.statusVerif)} (${esc(a.userVerif)})</span></div>
            </div>
          ` : state.drawerTab === 'parts' ? `
            <table class="w-full text-left border-collapse table-fixed border border-[var(--card-border)]">
              <thead class="bg-slate-50 border-b border-[var(--card-border)] text-[10px] uppercase text-[var(--muted-foreground)]">
                <tr><th class="py-2 px-2.5">Tgl &amp; Bukti BKB</th><th class="py-2 px-2.5">Sparepart &amp; Umur</th><th class="py-2 px-2 text-right">Biaya</th></tr>
              </thead>
              <tbody class="divide-y divide-[var(--card-border)]">
                ${a.parts.map(pt => `
                  <tr>
                    <td class="py-2 px-2.5 font-mono text-[10.5px]"><div>${esc(pt.tgl)}</div><div class="text-[9.5px] text-[var(--muted-foreground)] break-all">${esc(pt.bukti)}</div></td>
                    <td class="py-2 px-2.5"><div class="font-medium">${esc(pt.partName)}</div><div class="text-[10px] text-[var(--muted-foreground)]">${esc(pt.sub)} &bull; Umur: ${esc(pt.umurPart)}</div></td>
                    <td class="py-2 px-2 text-right font-mono font-semibold">${formatRp(pt.biaya)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : state.drawerTab === 'mutasi' ? `
            <div class="space-y-3 border border-[var(--card-border)] rounded p-3">
              <div class="font-semibold">Mutasi Departemen, Section &amp; Lokasi Fisik</div>
              <div><label class="block text-[11px] mb-1">Departemen / Section Tujuan</label><input type="text" value="${esc(a.dept)} - ${esc(a.section)}" class="w-full px-2.5 py-1.5 rounded border border-[var(--card-border)]" /></div>
              <div><label class="block text-[11px] mb-1">Location Site Baru</label><input type="text" value="${esc(a.lokasiName)}" class="w-full px-2.5 py-1.5 rounded border border-[var(--card-border)]" /></div>
              <button type="button" class="w-full py-2 rounded bg-[#2D4A94] text-white font-semibold cursor-pointer">Simpan Mutasi Unit</button>
            </div>
          ` : `
            <div class="space-y-3 border border-[var(--card-border)] rounded p-3">
              <div class="font-semibold">Update Kondisi Fisik / Pengajuan Disposal</div>
              <div><label class="block text-[11px] mb-1">Kondisi Saat Ini</label><input type="text" value="${esc(a.kondisi)}" class="w-full px-2.5 py-1.5 rounded border border-[var(--card-border)]" /></div>
              <button type="button" class="w-full py-2 rounded bg-[#0E5E63] text-white font-semibold cursor-pointer">Simpan Pembaruan Status</button>
            </div>
          `}
        </div>

        <div class="p-3 border-t border-[var(--card-border)] flex items-center justify-between gap-2">
          <button type="button" onclick="openPrintSummary('${esc(a.kode)}')" class="flex-1 py-1.5 rounded bg-[#2D4A94] text-white font-medium cursor-pointer">Cetak Rangkuman Detail Unit</button>
          <button type="button" onclick="closeDrawer()" class="px-3 py-1.5 rounded border border-[var(--card-border)] cursor-pointer">Tutup</button>
        </div>
      `;
    }

    function openPrintSummary(forceKode) {
      const list = forceKode
        ? PROTOTYPE_ASSETS.filter(a => a.kode === forceKode)
        : (state.selectedPrintCodes.size > 0
            ? PROTOTYPE_ASSETS.filter(a => state.selectedPrintCodes.has(a.kode))
            : getFilteredAssets().slice(0, 1));

      if (list.length === 0) return;
      document.getElementById('print-body').innerHTML = `
        <div class="flex items-start justify-between pb-3 border-b border-[var(--card-border)]">
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">PT PRATAMA NUSANTARA SAKTI &bull; RANGKUMAN DETAIL CETAK</div>
            <h3 class="text-base font-semibold mt-0.5">${list.length > 1 ? `Rangkuman Detail ${list.length} Unit Terpilih` : `Detail Unit: ${esc(list[0].nama)}`}</h3>
          </div>
          <div class="flex items-center gap-2 no-print">
            <button type="button" onclick="window.print()" class="px-3 py-1.5 rounded bg-[#2D4A94] text-white text-xs font-semibold cursor-pointer">Print / PDF</button>
            <button type="button" onclick="closePrintSummary()" class="px-3 py-1.5 rounded border border-[var(--card-border)] text-xs cursor-pointer">Tutup</button>
          </div>
        </div>
        <div class="space-y-4 mt-3 text-xs">
          ${list.map(u => `
            <div class="border border-[var(--card-border)] rounded p-3 space-y-2">
              <div class="flex justify-between font-semibold"><span>${esc(u.kode)} (${esc(u.alias)}) &bull; ${esc(u.nama)}</span><span>${esc(u.dept)} (${esc(u.section)})</span></div>
              <div class="grid grid-cols-5 gap-2 text-[11px] bg-[var(--background)] p-2 rounded">
                <div><span class="text-[var(--muted-foreground)] block">Tgl Perolehan</span><b>${esc(u.tglPerolehan)}</b></div>
                <div><span class="text-[var(--muted-foreground)] block">Umur s/d Kini</span><b>${u.umur} / ${u.stdUmur} thn</b></div>
                <div><span class="text-[var(--muted-foreground)] block">Nilai Perolehan</span><b>${formatRp(u.hpp)}</b></div>
                <div><span class="text-[var(--muted-foreground)] block">Nilai Buku</span><b>${formatRp(u.nbv)}</b></div>
                <div><span class="text-[var(--muted-foreground)] block">Total Maintenance</span><b class="fm-accent">${formatRp(u.mtc)}</b></div>
              </div>
              <table class="w-full text-left border-collapse table-fixed border-t border-[var(--card-border)] text-[11px]">
                <thead><tr class="text-[var(--muted-foreground)]"><th class="py-1">Tgl &amp; BKB</th><th class="py-1">Sparepart &amp; Umur Pakai</th><th class="py-1 text-right">Biaya</th></tr></thead>
                <tbody>
                  ${u.parts.map(pt => `<tr class="border-t border-[var(--card-border)]"><td class="py-1 font-mono">${esc(pt.tgl)} &bull; ${esc(pt.bukti)}</td><td class="py-1">${esc(pt.partName)} (${esc(pt.qty)}, Umur ${esc(pt.umurPart)})</td><td class="py-1 text-right font-mono">${formatRp(pt.biaya)}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('print-modal').classList.remove('hidden');
    }

    function closePrintSummary() {
      document.getElementById('print-modal').classList.add('hidden');
    }

    function renderAll() { renderSidebar(); renderMain(); }
    window.renderAll = renderAll;
    window.gotoId = gotoId;
    window.openDrawer = openDrawer;
    window.openPrintSummary = openPrintSummary;
    renderAll();
  </script>
</body>
</html>
