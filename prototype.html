<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PNS Asset &amp; Facility Enterprise — Clean Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --background: #f8fafc; --card: #ffffff; --sidebar: #ffffff; --card-border: #e2e8f0; --foreground: #0f172a; --muted-foreground: #64748b; }

    * { box-sizing: border-box; }
    body { font-size: 13px; line-height: 1.45; }
    .num-tabular { font-variant-numeric: tabular-nums; }
    .am-accent { color: #2D4A94; }
    .am-border-active { border-left: 3px solid #2D4A94; background: rgba(45, 74, 148, 0.08); color: #2D4A94; font-weight: 600; }
    .fm-accent { color: #0E5E63; }
    .fm-border-active { border-left: 3px solid #0E5E63; background: rgba(14, 94, 99, 0.08); color: #0E5E63; font-weight: 600; }
    @media print {
      body > *:not(#print-modal) { display: none !important; }
      #print-modal { position: static !important; background: #fff !important; padding: 0 !important; display: block !important; }
      #print-card { max-width: 100% !important; max-height: none !important; border: none !important; box-shadow: none !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>

          <button type="button" id="btn-mod-fm" onclick="switchModule('fm')" class="py-1.5 rounded text-center font-medium text-[var(--muted-foreground)] cursor-pointer transition">
            Facility (FM)

        </div>
      </div>

      <!-- MENU BERTINGKAT -->
      <nav id="sidebar-menu" class="flex-1 overflow-y-auto p-2 space-y-3 text-xs">
        <!-- Populated by JS -->
      </nav>

      <!-- FOOTER STATUS RINGKAS -->
      <div class="p-3 border-t border-[var(--card-border)] text-[11px] text-[var(--muted-foreground)] flex items-center justify-between">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>Live API: 35.242 Aset</span>
        </span>
        <span class="font-mono text-[10px]">Contoh UI</span>

    </aside>

        <div class="flex items-center gap-2 min-w-0">
          <button type="button" onclick="toggleSidebar(true)" class="lg:hidden px-2.5 py-1.5 border border-[var(--card-border)] rounded text-xs">☰</button>
          <div id="top-breadcrumb" class="text-xs text-[var(--muted-foreground)] truncate flex items-center gap-1.5">
            <!-- Populated by JS -->
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <div class="relative w-48 sm:w-64">
            <input id="global-search" type="text" oninput="onGlobalSearch(this.value)" placeholder="Cari aset, section, kode... (Ctrl+K)"

          </div>
          <button type="button" onclick="openPrintSummary()" class="px-2.5 py-1.5 rounded text-xs font-medium bg-[#2D4A94] text-white hover:opacity-90 cursor-pointer transition">
            Cetak Rangkuman
          </button>
        </div>
      </header>

      <!-- WORKSPACE BODY -->

        <!-- Populated by JS based on current view -->

    </div>

    function switchModule(mod) {
      state.module = mod;

      renderAll();

      state.curId = id;

      renderAll();

    function onGlobalSearch(val) {
      state.filter.search = String(val || '').trim().toLowerCase();
      renderMain();

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        const el = document.getElementById('global-search');
        if (el) el.focus();
      }
      if (e.key === 'Escape') {
        closeDrawer();
        closePrintSummary();
      }
    });

    function renderSidebar() {
      const nav = document.getElementById('sidebar-menu');
      const groups = MENUS[state.module] || [];
      const activeCls = state.module === 'am' ? 'am-border-active' : 'fm-border-active';
      nav.innerHTML = groups.map(g => `
        <div class="space-y-1">
          <div class="px-2 pt-1 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">${esc(g.group)}</div>

              const isAct = state.curId === it.id;
              return `
                <button type="button" onclick="gotoId('${it.id}')"

                  <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[var(--background)] border border-[var(--card-border)] text-[var(--muted-foreground)]">${esc(it.badge)}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');

      // Update Breadcrumb
      const curItem = groups.flatMap(g => g.items).find(i => i.id === state.curId);
      const curGroup = groups.find(g => g.items.some(i => i.id === state.curId));
      const modName = state.module === 'am' ? 'Asset Management' : 'Facility Management';
      document.getElementById('top-breadcrumb').innerHTML = `
        <span>${modName}</span>
        <span>/</span>
        <span>${curGroup ? esc(curGroup.group) : ''}</span>
        <span>/</span>
        <span class="font-semibold text-[var(--foreground)]">${curItem ? esc(curItem.label) : ''}</span>
      `;
    }

    function getFilteredAssets() {
      return PROTOTYPE_ASSETS.filter(a => {
        if (state.filter.dept && a.dept !== state.filter.dept) return false;
        if (state.filter.section && a.section !== state.filter.section) return false;
        if (state.filter.kelompok && a.kelompok !== state.filter.kelompok) return false;
        if (state.filter.loc && a.loc !== state.filter.loc) return false;
        if (state.filter.kondisi !== 'ALL' && a.kondisi !== state.filter.kondisi) return false;
        if (state.filter.search) {
          const hay = `${a.kode} ${a.alias} ${a.nama} ${a.dept} ${a.section} ${a.sectionName} ${a.kelompok} ${a.loc}`.toLowerCase();
          if (!hay.includes(state.filter.search)) return false;
        }
        return true;
      });
    }

      state.groupBy = mode;
      state.filter.dept = null;
      state.filter.section = null;
      state.filter.kelompok = null;

      if (state.expandedL1.has(key)) state.expandedL1.delete(key);

      else state.expandedL2.add(key);
      renderMain();
    }

    function applyTreeFilter(dept, section, kelompok, loc, e) {
      if (e) e.stopPropagation();
      state.filter.dept = dept || null;
      state.filter.section = section || null;
      state.filter.kelompok = kelompok || null;
      state.filter.loc = loc || null;
      renderMain();
    }

    function togglePrintSelect(kode, e) {
      if (e) e.stopPropagation();
      if (state.selectedPrintCodes.has(kode)) state.selectedPrintCodes.delete(kode);
      else state.selectedPrintCodes.add(kode);
      renderMain();
    }

    function renderAmExplorer() {
      const filtered = getFilteredAssets();
      const totalHpp = filtered.reduce((s, a) => s + a.hpp, 0);
      const totalNbv = filtered.reduce((s, a) => s + a.nbv, 0);
      const totalMtc = filtered.reduce((s, a) => s + a.mtc, 0);
      const goodCount = filtered.filter(a => a.kondisi === 'Good Condition').length;
      const selisihCount = filtered.filter(a => a.statusVerif !== 'ALOKASI SESUAI').length;

      // Build Hierarchy Tree Rows based on state.groupBy
      const treeRows = [];
      if (state.groupBy === 'dept') {
        const depts = [...new Set(PROTOTYPE_ASSETS.map(a => a.dept))];
        depts.forEach(d => {
          const dAssets = PROTOTYPE_ASSETS.filter(a => a.dept === d);
          const dSesuai = dAssets.filter(a => a.statusVerif === 'ALOKASI SESUAI').length;
          const dSelisih = dAssets.length - dSesuai;
          const isExpL1 = state.expandedL1.has(d);
          const isActiveL1 = state.filter.dept === d && !state.filter.section && !state.filter.kelompok;

          treeRows.push(`
            <tr onclick="applyTreeFilter('${esc(d)}', null, null, null, event)"
                class="border-b border-[var(--card-border)] cursor-pointer transition ${isActiveL1 ? 'bg-[#2D4A94]/10 font-semibold' : 'hover:bg-[var(--background)]'}">
              <td class="py-2 px-3">
                <div class="flex items-center gap-2">
                  <button type="button" onclick="event.stopPropagation(); toggleL1('${esc(d)}')"
                          class="w-5 h-5 rounded border border-[var(--card-border)] bg-[var(--background)] text-[11px] font-mono flex items-center justify-center cursor-pointer">
                    ${isExpL1 ? '−' : '+'}
                  </button>
                  <span class="font-semibold">${esc(d)}</span>
                  <span class="text-[10px] text-[var(--muted-foreground)]">(Departemen)</span>
                </div>
              </td>
              <td class="py-2 px-2.5 text-right num-tabular">${dSesuai}</td>
              <td class="py-2 px-2.5 text-right num-tabular ${dSelisih > 0 ? 'text-rose-500 font-semibold' : 'text-[var(--muted-foreground)]'}">${dSelisih || '-'}</td>
              <td class="py-2 px-2.5 text-right num-tabular font-semibold">${dAssets.length}</td>
              <td class="py-2 px-3 text-right font-mono text-[11px]">${formatRp(dAssets.reduce((s, x) => s + x.nbv, 0))}</td>
            </tr>
          `);

          if (isExpL1) {
            const sections = [...new Set(dAssets.map(a => a.section))];
            sections.forEach(sec => {
              const sAssets = dAssets.filter(a => a.section === sec);
              const secLabel = sAssets[0].sectionName;
              const sSesuai = sAssets.filter(a => a.statusVerif === 'ALOKASI SESUAI').length;
              const sSelisih = sAssets.length - sSesuai;
              const l2Key = d + '|' + sec;
              const isExpL2 = state.expandedL2.has(sec) || state.expandedL2.has(l2Key);
              const isActiveL2 = state.filter.dept === d && state.filter.section === sec && !state.filter.kelompok;

              treeRows.push(`
                <tr onclick="applyTreeFilter('${esc(d)}', '${esc(sec)}', null, null, event)"
                    class="border-b border-[var(--card-border)] cursor-pointer transition ${isActiveL2 ? 'bg-[#2D4A94]/10 font-semibold' : 'bg-[var(--background)]/50 hover:bg-[var(--background)]'}">
                  <td class="py-1.5 pl-8 pr-3">
                    <div class="flex items-center gap-2">
                      <button type="button" onclick="toggleL2('${esc(sec)}', event)"
                              class="w-4 h-4 rounded border border-[var(--card-border)] bg-[var(--card)] text-[10px] font-mono flex items-center justify-center cursor-pointer">
                        ${isExpL2 ? '−' : '+'}
                      </button>
                      <span class="font-mono text-[11px] font-semibold am-accent">${esc(sec)}</span>
                      <span>${esc(secLabel)}</span>
                      <span class="text-[10px] text-[var(--muted-foreground)]">(Section)</span>
                    </div>
                  </td>
                  <td class="py-1.5 px-2.5 text-right num-tabular text-xs">${sSesuai}</td>
                  <td class="py-1.5 px-2.5 text-right num-tabular text-xs ${sSelisih > 0 ? 'text-rose-500 font-semibold' : 'text-[var(--muted-foreground)]'}">${sSelisih || '-'}</td>
                  <td class="py-1.5 px-2.5 text-right num-tabular text-xs font-medium">${sAssets.length}</td>
                  <td class="py-1.5 px-3 text-right font-mono text-[11px] text-[var(--muted-foreground)]">${formatRp(sAssets.reduce((s, x) => s + x.nbv, 0))}</td>
                </tr>
              `);

              if (isExpL2) {
                const kels = [...new Set(sAssets.map(a => a.kelompok))];
                kels.forEach(kl => {
                  const kAssets = sAssets.filter(a => a.kelompok === kl);
                  const kSesuai = kAssets.filter(a => a.statusVerif === 'ALOKASI SESUAI').length;
                  const kSelisih = kAssets.length - kSesuai;
                  const isActiveL3 = state.filter.dept === d && state.filter.section === sec && state.filter.kelompok === kl;

                  treeRows.push(`
                    <tr onclick="applyTreeFilter('${esc(d)}', '${esc(sec)}', '${esc(kl)}', null, event)"
                        class="border-b border-[var(--card-border)] cursor-pointer transition text-xs ${isActiveL3 ? 'bg-[#2D4A94]/15 font-semibold' : 'hover:bg-[var(--background)]'}">
                      <td class="py-1.5 pl-14 pr-3 text-[var(--muted-foreground)]">
                        <span class="mr-1">↳</span>
                        <span class="text-[var(--foreground)] font-medium">${esc(kl)}</span>
                        <span class="text-[10px] ml-1">(Kelompok)</span>
                      </td>
                      <td class="py-1.5 px-2.5 text-right num-tabular">${kSesuai}</td>
                      <td class="py-1.5 px-2.5 text-right num-tabular ${kSelisih > 0 ? 'text-rose-500 font-semibold' : 'text-[var(--muted-foreground)]'}">${kSelisih || '-'}</td>
                      <td class="py-1.5 px-2.5 text-right num-tabular">${kAssets.length}</td>
                      <td class="py-1.5 px-3 text-right font-mono text-[11px]">${formatRp(kAssets.reduce((s, x) => s + x.nbv, 0))}</td>
                    </tr>
                  `);
                });
              }
            });
          }
        });
      } else if (state.groupBy === 'loc') {
        const locs = [...new Set(PROTOTYPE_ASSETS.map(a => a.loc))];
        locs.forEach(l => {
          const lAssets = PROTOTYPE_ASSETS.filter(a => a.loc === l);
          const lName = lAssets[0].lokasiName;
          const isExpL1 = state.expandedL1.has(l);
          const isAct = state.filter.loc === l && !state.filter.section;
          treeRows.push(`
            <tr onclick="applyTreeFilter(null, null, null, '${esc(l)}', event)"
                class="border-b border-[var(--card-border)] cursor-pointer ${isAct ? 'bg-[#2D4A94]/10 font-semibold' : 'hover:bg-[var(--background)]'}">
              <td class="py-2 px-3">
                <div class="flex items-center gap-2">
                  <button type="button" onclick="event.stopPropagation(); toggleL1('${esc(l)}')"
                          class="w-5 h-5 rounded border border-[var(--card-border)] bg-[var(--background)] text-[11px] font-mono flex items-center justify-center cursor-pointer">${isExpL1 ? '−' : '+'}</button>
                  <span class="font-semibold">${esc(lName)}</span>
                </div>
              </td>
              <td class="py-2 px-2.5 text-right num-tabular">${lAssets.filter(x => x.statusVerif === 'ALOKASI SESUAI').length}</td>
              <td class="py-2 px-2.5 text-right num-tabular">${lAssets.filter(x => x.statusVerif !== 'ALOKASI SESUAI').length || '-'}</td>
              <td class="py-2 px-2.5 text-right num-tabular font-semibold">${lAssets.length}</td>
              <td class="py-2 px-3 text-right font-mono text-[11px]">${formatRp(lAssets.reduce((s, x) => s + x.nbv, 0))}</td>
            </tr>
          `);
          if (isExpL1) {
            [...new Set(lAssets.map(a => a.section))].forEach(sec => {
              const sAssets = lAssets.filter(a => a.section === sec);
              treeRows.push(`
                <tr onclick="applyTreeFilter(null, '${esc(sec)}', null, '${esc(l)}', event)"
                    class="border-b border-[var(--card-border)] cursor-pointer text-xs hover:bg-[var(--background)]">
                  <td class="py-1.5 pl-9 pr-3"><span class="mr-1">↳</span> <span class="font-mono font-semibold am-accent">${esc(sec)}</span> &bull; ${esc(sAssets[0].sectionName)} (${esc(sAssets[0].dept)})</td>
                  <td class="py-1.5 px-2.5 text-right num-tabular">${sAssets.filter(x => x.statusVerif === 'ALOKASI SESUAI').length}</td>
                  <td class="py-1.5 px-2.5 text-right num-tabular">${sAssets.filter(x => x.statusVerif !== 'ALOKASI SESUAI').length || '-'}</td>
                  <td class="py-1.5 px-2.5 text-right num-tabular">${sAssets.length}</td>
                  <td class="py-1.5 px-3 text-right font-mono text-[11px]">${formatRp(sAssets.reduce((s, x) => s + x.nbv, 0))}</td>
                </tr>
              `);
            });
          }
        });
      } else {
        const kels = [...new Set(PROTOTYPE_ASSETS.map(a => a.kelompok))];
        kels.forEach(kl => {
          const kAssets = PROTOTYPE_ASSETS.filter(a => a.kelompok === kl);
          treeRows.push(`
            <tr onclick="applyTreeFilter(null, null, '${esc(kl)}', null, event)"
                class="border-b border-[var(--card-border)] cursor-pointer hover:bg-[var(--background)]">
              <td class="py-2 px-3 font-semibold">${esc(kl)}</td>
              <td class="py-2 px-2.5 text-right num-tabular">${kAssets.filter(x => x.statusVerif === 'ALOKASI SESUAI').length}</td>
              <td class="py-2 px-2.5 text-right num-tabular">${kAssets.filter(x => x.statusVerif !== 'ALOKASI SESUAI').length || '-'}</td>
              <td class="py-2 px-2.5 text-right num-tabular font-semibold">${kAssets.length}</td>
              <td class="py-2 px-3 text-right font-mono text-[11px]">${formatRp(kAssets.reduce((s, x) => s + x.nbv, 0))}</td>
            </tr>
          `);
        });
      }

      const activeFilterTags = [
        state.filter.dept ? `Dept: ${state.filter.dept}` : null,
        state.filter.section ? `Section: ${state.filter.section}` : null,
        state.filter.kelompok ? `Kelompok: ${state.filter.kelompok}` : null,
        state.filter.loc ? `Lokasi: ${state.filter.loc}` : null
      ].filter(Boolean);

      return `
        <!-- NOTICE DATA CONTOH + RINGKASAN -->
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h1 class="text-base font-semibold tracking-tight">Explorer Validasi &amp; Pergerakan Aset</h1>
            <p class="text-xs text-[var(--muted-foreground)]">Alur satu pintu: Klik baris hierarki (Dept ➔ Section ➔ Kelompok) ➔ Filter tabel di bawah ➔ Klik unit untuk Dossier &amp; Mutasi di panel kanan. <span class="font-mono">[Data contoh terstruktur]</span></p>
          </div>
          <div class="inline-flex rounded border border-[var(--card-border)] bg-[var(--card)] p-0.5 text-[11px]">
            <button type="button" onclick="setGroupBy('dept')" class="px-2.5 py-1 rounded cursor-pointer ${state.groupBy === 'dept' ? 'bg-[#2D4A94] text-white font-semibold' : 'text-[var(--muted-foreground)]'}">Dept ➔ Section ➔ Kelompok</button>
            <button type="button" onclick="setGroupBy('loc')" class="px-2.5 py-1 rounded cursor-pointer ${state.groupBy === 'loc' ? 'bg-[#2D4A94] text-white font-semibold' : 'text-[var(--muted-foreground)]'}">Lokasi ➔ Section</button>
            <button type="button" onclick="setGroupBy('kel')" class="px-2.5 py-1 rounded cursor-pointer ${state.groupBy === 'kel' ? 'bg-[#2D4A94] text-white font-semibold' : 'text-[var(--muted-foreground)]'}">Kelompok Aset</button>
          </div>
        </div>

        <!-- RINGKASAN STRIP BERSEKAT (SATU KALI TAMPIL, TANPA PENGULANGAN) -->
        <div class="grid grid-cols-2 sm:grid-cols-5 divide-y sm:divide-y-0 sm:divide-x divide-[var(--card-border)] border border-[var(--card-border)] rounded bg-[var(--card)]">
          <div class="p-3">
            <div class="text-[11px] text-[var(--muted-foreground)]">Unit Terfilter</div>
            <div class="text-base font-semibold num-tabular mt-0.5">${filtered.length} <span class="text-xs font-normal text-[var(--muted-foreground)]">/ 35.242 total</span></div>
          </div>
          <div class="p-3">
            <div class="text-[11px] text-[var(--muted-foreground)]">Kesesuaian &amp; Kondisi Baik</div>
            <div class="text-base font-semibold num-tabular mt-0.5 flex items-center gap-2">
              <span>${goodCount}/${filtered.length} Baik</span>
              ${selisihCount > 0 ? `<span class="text-[11px] text-rose-500">(${selisihCount} Selisih)</span>` : ''}
            </div>
          </div>
          <div class="p-3">
            <div class="text-[11px] text-[var(--muted-foreground)]">Nilai Perolehan (HPP)</div>
            <div class="text-sm font-semibold font-mono num-tabular mt-1">${formatRp(totalHpp)}</div>
          </div>
          <div class="p-3">
            <div class="text-[11px] text-[var(--muted-foreground)]">Nilai Buku (NBV)</div>
            <div class="text-sm font-semibold font-mono num-tabular mt-1 am-accent">${formatRp(totalNbv)}</div>
          </div>
          <div class="p-3">
            <div class="text-[11px] text-[var(--muted-foreground)]">Total Maintenance (BKB)</div>
            <div class="text-sm font-semibold font-mono num-tabular mt-1 fm-accent">${formatRp(totalMtc)}</div>
          </div>
        </div>

        <!-- BLOK 1: HIERARKI DRILL-DOWN TABLE (DEPARTEMEN -> SECTION -> KELOMPOK) -->
        <div class="border border-[var(--card-border)] rounded bg-[var(--card)] overflow-hidden">
          <div class="px-3 py-2 border-b border-[var(--card-border)] flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2">
              <span class="font-semibold">Matriks Hierarki (${state.groupBy === 'dept' ? 'Departemen ➔ Section ➔ Kelompok' : state.groupBy === 'loc' ? 'Lokasi ➔ Section' : 'Kelompok Aset'})</span>
              ${activeFilterTags.length > 0 ? `
                <span class="px-2 py-0.5 rounded bg-[#2D4A94]/10 am-accent font-medium text-[11px]">${esc(activeFilterTags.join(' ▸ '))}</span>
                <button type="button" onclick="applyTreeFilter(null, null, null, null, event)" class="text-[11px] underline text-[var(--muted-foreground)] cursor-pointer">Reset Filter</button>
              ` : ''}
            </div>
            <span class="text-[11px] text-[var(--muted-foreground)]">Klik [+] untuk buka sub-level &bull; Klik baris untuk memfilter detail</span>
          </div>

          <div class="max-h-56 overflow-y-auto overflow-x-hidden">
            <table class="w-full text-left border-collapse table-fixed text-xs">
              <colgroup>
                <col style="width: 48%;" />
                <col style="width: 11%;" />
                <col style="width: 11%;" />
                <col style="width: 11%;" />
                <col style="width: 19%;" />
              </colgroup>
              <thead class="sticky top-0 z-10 bg-[var(--card)] border-b border-[var(--card-border)] text-[10px] uppercase tracking-wider text-[var(--muted-foreground)]">
                <tr>
                  <th class="py-2 px-3">Struktur Organisasi / Klasifikasi</th>
                  <th class="py-2 px-2.5 text-right">Sesuai</th>
                  <th class="py-2 px-2.5 text-right">Selisih</th>
                  <th class="py-2 px-2.5 text-right">Total</th>
                  <th class="py-2 px-3 text-right">Nilai Buku (NBV)</th>
                </tr>
              </thead>
              <tbody>${treeRows.join('')}</tbody>
            </table>
          </div>
        </div>

        <!-- BLOK 2: TABEL DETAIL ASET 100% FIT-TO-SCREEN (FROZEN HEADER, ZERO SCROLL KANAN) -->
        <div class="border border-[var(--card-border)] rounded bg-[var(--card)] overflow-hidden">
          <div class="px-3 py-2 border-b border-[var(--card-border)] flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2">
              <span class="font-semibold">Rincian Unit Aset (${filtered.length} Unit)</span>
              ${state.selectedPrintCodes.size > 0 ? `
                <button type="button" onclick="openPrintSummary()" class="px-2 py-0.5 rounded bg-[#2D4A94] text-white text-[11px] font-medium cursor-pointer">
                  Cetak Detail (${state.selectedPrintCodes.size} Unit Dipilih)
                </button>
                <button type="button" onclick="state.selectedPrintCodes.clear(); renderMain();" class="text-[11px] underline text-[var(--muted-foreground)] cursor-pointer">Batal Pilih</button>
              ` : ''}
            </div>
            <div class="flex items-center gap-2">
              <select onchange="state.filter.kondisi = this.value; renderMain();" class="px-2 py-1 rounded border border-[var(--card-border)] bg-[var(--background)] text-xs cursor-pointer">
                <option value="ALL" ${state.filter.kondisi === 'ALL' ? 'selected' : ''}>Semua Kondisi</option>
                <option value="Good Condition" ${state.filter.kondisi === 'Good Condition' ? 'selected' : ''}>Good Condition</option>
                <option value="Repair" ${state.filter.kondisi === 'Repair' ? 'selected' : ''}>Repair</option>
                <option value="Broken" ${state.filter.kondisi === 'Broken' ? 'selected' : ''}>Broken</option>
              </select>
            </div>
          </div>

          <div class="max-h-72 overflow-y-auto overflow-x-hidden">
            <table class="w-full text-left border-collapse table-fixed text-xs">
              <colgroup>
                <col style="width: 19%;" />
                <col style="width: 28%;" />
                <col style="width: 17%;" />
                <col style="width: 12%;" />
                <col style="width: 16%;" />
                <col style="width: 8%;" />
              </colgroup>
              <thead class="sticky top-0 z-10 bg-[var(--card)] border-b border-[var(--card-border)] text-[10px] uppercase tracking-wider text-[var(--muted-foreground)]">
                <tr>
                  <th class="py-2 px-3">Unit, Dept &amp; Site</th>
                  <th class="py-2 px-2.5">Nama Aset &amp; Kategori</th>
                  <th class="py-2 px-2.5">Status &amp; Validasi</th>
                  <th class="py-2 px-2 text-right">Perolehan &amp; Umur</th>
                  <th class="py-2 px-2.5 text-right">NBV &amp; MTC</th>
                  <th class="py-2 px-2 text-center">Panel</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[var(--card-border)]">
                ${filtered.length === 0 ? `
                  <tr><td colspan="6" class="py-8 text-center text-[var(--muted-foreground)]">Tidak ada unit yang cocok dengan filter ini.</td></tr>
                ` : filtered.map(a => {
                  const dotColor = a.kondisi === 'Good Condition' ? 'bg-emerald-500' : (a.kondisi === 'Repair' ? 'bg-amber-500' : 'bg-rose-500');
                  const isChk = state.selectedPrintCodes.has(a.kode);
                  const isAct = state.drawerAssetCode === a.kode;
                  return `
                    <tr onclick="openDrawer('${esc(a.kode)}')"
                        class="cursor-pointer transition ${isAct ? 'bg-[#2D4A94]/10' : 'hover:bg-[var(--background)]'}">
                      <td class="py-2.5 px-3 align-top">
                        <div class="flex items-start gap-1.5">
                          <input type="checkbox" ${isChk ? 'checked' : ''} onclick="togglePrintSelect('${esc(a.kode)}', event)" class="mt-0.5 cursor-pointer shrink-0" title="Pilih untuk cetak multi-unit" />
                          <div class="min-w-0">
                            <div class="font-mono font-semibold text-[11px] am-accent truncate">${esc(a.kode)}</div>
                            <div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">${esc(a.loc)} &bull; ${esc(a.dept)} (${esc(a.section)})</div>
                          </div>
                        </div>
                      </td>
                      <td class="py-2.5 px-2.5 align-top">
                        <div class="font-medium leading-snug">${esc(a.nama)}</div>
                        <div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">${esc(a.kelompok)} &bull; ${esc(a.subKat)}</div>
                      </td>
                      <td class="py-2.5 px-2.5 align-top">
                        <div class="flex items-center gap-1.5">
                          <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
                          <span class="font-medium">${esc(a.kondisi)}</span>
                        </div>
                        <div class="text-[10px] ${a.statusVerif === 'ALOKASI SESUAI' ? 'text-[var(--muted-foreground)]' : 'text-rose-500 font-medium'} mt-0.5">${esc(a.statusVerif)} &bull; ${esc(a.tglVerif)}</div>
                      </td>
                      <td class="py-2.5 px-2 text-right align-top font-mono">
                        <div>${esc(a.tglPerolehan)}</div>
                        <div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">${a.umur} / ${a.stdUmur} thn</div>
                      </td>
                      <td class="py-2.5 px-2.5 text-right align-top font-mono">
                        <div class="font-semibold">${formatRp(a.nbv)}</div>
                        <div class="text-[10px] text-[var(--muted-foreground)] mt-0.5">MTC: ${formatRp(a.mtc)}</div>
                      </td>
                      <td class="py-2.5 px-2 text-center align-top">
                        <span class="text-[11px] font-medium am-accent">Buka &rarr;</span>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderAmOverview() {
      const totalHpp = PROTOTYPE_ASSETS.reduce((s, a) => s + a.hpp, 0);
      const totalNbv = PROTOTYPE_ASSETS.reduce((s, a) => s + a.nbv, 0);
      const totalMtc = PROTOTYPE_ASSETS.reduce((s, a) => s + a.mtc, 0);
      return `
        <div>
          <h1 class="text-base font-semibold">Ringkasan Valuasi &amp; Portofolio</h1>
          <p class="text-xs text-[var(--muted-foreground)]">Satu tampilan konsolidasi menggantikan menu terpisah Komposisi &amp; Sebaran Site. <span class="font-mono">[Data contoh]</span></p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 divide-y sm:divide-y-0 sm:divide-x divide-[var(--card-border)] border border-[var(--card-border)] rounded bg-[var(--card)]">
          <div class="p-4"><div class="text-xs text-[var(--muted-foreground)]">Total HPP (Sampel)</div><div class="text-lg font-semibold font-mono mt-1">${formatRp(totalHpp)}</div></div>
          <div class="p-4"><div class="text-xs text-[var(--muted-foreground)]">Total NBV (Sampel)</div><div class="text-lg font-semibold font-mono am-accent mt-1">${formatRp(totalNbv)}</div></div>
          <div class="p-4"><div class="text-xs text-[var(--muted-foreground)]">Total Maintenance (Sampel)</div><div class="text-lg font-semibold font-mono fm-accent mt-1">${formatRp(totalMtc)}</div></div>
        </div>
        <div class="p-4 border border-[var(--card-border)] rounded bg-[var(--card)] text-xs text-[var(--muted-foreground)]">
          Klik <button type="button" onclick="gotoId('am-explorer')" class="underline am-accent font-semibold cursor-pointer">Explorer &amp; Validasi Aset</button> untuk drill-down lengkap per Departemen, Section, Lokasi, dan Kategori.
        </div>
      `;
    }

    function renderAmMaint() {
      const maintUnits = PROTOTYPE_ASSETS.slice().sort((a, b) => b.mtc - a.mtc);
      return `
        <div>
          <h1 class="text-base font-semibold">Realisasi Maintenance &amp; BKB</h1>
          <p class="text-xs text-[var(--muted-foreground)]">Klik baris unit untuk membuka riwayat sparepart BKB dan detail finansial unit di panel kanan. <span class="font-mono">[Data contoh]</span></p>
        </div>
        <div class="border border-[var(--card-border)] rounded bg-[var(--card)] overflow-hidden">
          <table class="w-full text-left border-collapse table-fixed text-xs">
            <colgroup><col style="width:20%" /><col style="width:32%" /><col style="width:16%" /><col style="width:16%" /><col style="width:16%" /></colgroup>
            <thead class="border-b border-[var(--card-border)] text-[10px] uppercase text-[var(--muted-foreground)]">
              <tr>
                <th class="py-2 px-3">Unit &amp; Section</th>
                <th class="py-2 px-2.5">Nama Unit</th>
                <th class="py-2 px-2.5 text-right">Perolehan</th>
                <th class="py-2 px-2.5 text-right">Nilai Buku</th>
                <th class="py-2 px-3 text-right">Total BKB</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[var(--card-border)]">
              ${maintUnits.map(a => `
                <tr onclick="openDrawer('${esc(a.kode)}', 'parts')" class="hover:bg-[var(--background)] cursor-pointer">
                  <td class="py-2.5 px-3"><div class="font-mono font-semibold am-accent">${esc(a.alias)}</div><div class="text-[10px] text-[var(--muted-foreground)]">${esc(a.dept)} (${esc(a.section)})</div></td>
                  <td class="py-2.5 px-2.5 font-medium">${esc(a.nama)}</td>
                  <td class="py-2.5 px-2.5 text-right font-mono">${esc(a.tglPerolehan)}</td>
                  <td class="py-2.5 px-2.5 text-right font-mono">${formatRp(a.nbv)}</td>
                  <td class="py-2.5 px-3 text-right font-mono font-semibold fm-accent">${formatRp(a.mtc)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderFmHunian() {
      return `
        <div>
          <h1 class="text-base font-semibold">Direktori Hunian, Kamar &amp; Fasilitas (FM)</h1>
          <p class="text-xs text-[var(--muted-foreground)]">Menggabungkan kondisi hunian, kamar, penghuni (NIK disamarkan sesuai UU PDP), dan fasilitas dalam satu tabel utuh. <span class="font-mono">[Data contoh]</span></p>
        </div>
        <div class="border border-[var(--card-border)] rounded bg-[var(--card)] overflow-hidden">
          <table class="w-full text-left border-collapse table-fixed text-xs">
            <colgroup><col style="width:24%" /><col style="width:14%" /><col style="width:24%" /><col style="width:26%" /><col style="width:12%" /></colgroup>
            <thead class="border-b border-[var(--card-border)] text-[10px] uppercase text-[var(--muted-foreground)]">
              <tr>
                <th class="py-2 px-3">Gedung &amp; Site</th>
                <th class="py-2 px-2.5">Kamar</th>
                <th class="py-2 px-2.5">Penghuni (Terlindungi)</th>
                <th class="py-2 px-2.5">Ringkasan Fasilitas</th>
                <th class="py-2 px-3">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[var(--card-border)]">
              ${ROOM_SAMPLE_DATA.map(r => `
                <tr class="hover:bg-[var(--background)]">
                  <td class="py-2.5 px-3 font-medium">${esc(r.building)}</td>
                  <td class="py-2.5 px-2.5">${esc(r.room)} <span class="text-[10px] text-[var(--muted-foreground)]">(${r.occupied}/${r.capacity})</span></td>
                  <td class="py-2.5 px-2.5 font-mono text-[11px] text-[var(--muted-foreground)]">${esc(r.pic)}</td>
                  <td class="py-2.5 px-2.5">${esc(r.fasilitas)}</td>
                  <td class="py-2.5 px-3"><span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ${r.status === 'Sesuai Standar' ? 'bg-emerald-500' : 'bg-amber-500'}"></span>${esc(r.status)}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderMain() {
      const main = document.getElementById('workspace-main');
      if (state.curId === 'am-explorer') main.innerHTML = renderAmExplorer();
      else if (state.curId === 'am-overview') main.innerHTML = renderAmOverview();
      else if (state.curId === 'am-maint') main.innerHTML = renderAmMaint();
      else main.innerHTML = renderFmHunian();
    }

    function openDrawer(kode, tab) {
      state.drawerAssetCode = kode;
      state.drawerTab = tab || state.drawerTab || 'spec';
      document.getElementById('drawer-overlay').classList.remove('hidden');
      document.getElementById('unit-drawer').classList.remove('translate-x-full');
      renderDrawer();
      renderMain();
    }

    function closeDrawer() {
      state.drawerAssetCode = null;
      document.getElementById('drawer-overlay').classList.add('hidden');
      document.getElementById('unit-drawer').classList.add('translate-x-full');
      renderMain();
    }

    function renderDrawer() {
      const a = PROTOTYPE_ASSETS.find(x => x.kode === state.drawerAssetCode);
      if (!a) return;
      const ratioPct = a.hpp > 0 ? ((a.mtc / a.hpp) * 100).toFixed(1) : '0.0';
      document.getElementById('drawer-content').innerHTML = `
        <div class="p-4 border-b border-[var(--card-border)] flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-2 font-mono text-xs">
              <span class="font-semibold am-accent">${esc(a.kode)}</span>
              <span class="text-[var(--muted-foreground)]">(${esc(a.alias)})</span>
            </div>
            <h2 class="text-sm font-semibold mt-1 leading-snug">${esc(a.nama)}</h2>
            <p class="text-[11px] text-[var(--muted-foreground)] mt-0.5">${esc(a.dept)} ▸ ${esc(a.section)} (${esc(a.sectionName)}) &bull; ${esc(a.lokasiName)}</p>
          </div>
          <button type="button" onclick="closeDrawer()" class="px-2 py-1 border border-[var(--card-border)] rounded text-xs cursor-pointer">✕</button>
        </div>

        <!-- TAB KONTEKSTUAL TANPA KELUAR DARI TABEL -->
        <div class="px-4 pt-2 border-b border-[var(--card-border)] flex items-center gap-4 text-xs">
          <button type="button" onclick="state.drawerTab='spec'; renderDrawer()" class="pb-2 cursor-pointer ${state.drawerTab === 'spec' ? 'border-b-2 border-[#2D4A94] font-semibold am-accent' : 'text-[var(--muted-foreground)]'}">1. Detail &amp; Finansial</button>
          <button type="button" onclick="state.drawerTab='parts'; renderDrawer()" class="pb-2 cursor-pointer ${state.drawerTab === 'parts' ? 'border-b-2 border-[#2D4A94] font-semibold am-accent' : 'text-[var(--muted-foreground)]'}">2. Part BKB (${a.parts.length})</button>
          <button type="button" onclick="state.drawerTab='action'; renderDrawer()" class="pb-2 cursor-pointer ${state.drawerTab === 'action' ? 'border-b-2 border-[#2D4A94] font-semibold am-accent' : 'text-[var(--muted-foreground)]'}">3. Transaksi Mutasi</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
          ${state.drawerTab === 'spec' ? `
            <div class="grid grid-cols-2 gap-2.5">
              <div class="p-2.5 rounded border border-[var(--card-border)]">
                <div class="text-[10px] text-[var(--muted-foreground)]">Tanggal Perolehan</div>
                <div class="font-mono font-semibold mt-0.5">${esc(a.tglPerolehan)}</div>
              </div>
              <div class="p-2.5 rounded border border-[var(--card-border)]">
                <div class="text-[10px] text-[var(--muted-foreground)]">Umur Aset s/d Hari Ini</div>
                <div class="font-mono font-semibold mt-0.5">${a.umur} Tahun (Std: ${a.stdUmur} Thn)</div>
              </div>
              <div class="p-2.5 rounded border border-[var(--card-border)]">
                <div class="text-[10px] text-[var(--muted-foreground)]">Nilai Perolehan (HPP)</div>
                <div class="font-mono font-semibold mt-0.5">${formatRp(a.hpp)}</div>
              </div>
              <div class="p-2.5 rounded border border-[var(--card-border)]">
                <div class="text-[10px] text-[var(--muted-foreground)]">Nilai Buku (NBV)</div>
                <div class="font-mono font-semibold am-accent mt-0.5">${formatRp(a.nbv)}</div>
              </div>
              <div class="p-2.5 rounded border border-[var(--card-border)] col-span-2">
                <div class="text-[10px] text-[var(--muted-foreground)]">Total Maintenance (BKB)</div>
                <div class="font-mono font-semibold fm-accent mt-0.5">${formatRp(a.mtc)} <span class="text-[10px] font-normal text-[var(--muted-foreground)]">(${a.txCount} transaksi BKB &bull; ${ratioPct}% HPP)</span></div>
              </div>
            </div>
            <div class="border border-[var(--card-border)] rounded p-3 space-y-1.5">
              <div class="font-semibold">Klasifikasi Lengkap</div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Department / Section</span><span>${esc(a.dept)} / ${esc(a.section)}</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Kelompok / Kategori</span><span>${esc(a.kelompok)} / ${esc(a.kategori)}</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Sub Kategori</span><span>${esc(a.subKat)}</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Lokasi Fisik</span><span>${esc(a.lokasiName)}</span></div>
              <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">Verifikasi</span><span>${esc(a.statusVerif)} (${esc(a.userVerif)})</span></div>
            </div>
          ` : state.drawerTab === 'parts' ? `
            <table class="w-full text-left border-collapse table-fixed border border-[var(--card-border)]">
              <thead class="border-b border-[var(--card-border)] text-[10px] uppercase text-[var(--muted-foreground)]">
                <tr><th class="py-2 px-2.5">Tgl &amp; Bukti</th><th class="py-2 px-2.5">Sparepart</th><th class="py-2 px-2 text-right">Biaya</th></tr>
              </thead>
              <tbody class="divide-y divide-[var(--card-border)]">
                ${a.parts.map(pt => `
                  <tr>
                    <td class="py-2 px-2.5 font-mono text-[10.5px]"><div>${esc(pt.tgl)}</div><div class="text-[9.5px] text-[var(--muted-foreground)] break-all">${esc(pt.bukti)}</div></td>
                    <td class="py-2 px-2.5"><div class="font-medium">${esc(pt.partName)}</div><div class="text-[10px] text-[var(--muted-foreground)]">${esc(pt.sub)} &bull; ${esc(pt.qty)}</div></td>
                    <td class="py-2 px-2 text-right font-mono font-semibold">${formatRp(pt.biaya)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : `
            <div class="space-y-3">
              <div class="text-[var(--muted-foreground)]">Aksi perubahan data langsung pada unit ini tanpa perlu keluar ke menu terpisah:</div>
              <div>
                <label class="block text-[11px] font-medium mb-1">Ubah Kondisi Fisik</label>
                <select id="drawer-new-kond" class="w-full px-2.5 py-1.5 rounded border border-[var(--card-border)] bg-[var(--background)]">
                  <option ${a.kondisi === 'Good Condition' ? 'selected' : ''}>Good Condition</option>
                  <option ${a.kondisi === 'Repair' ? 'selected' : ''}>Repair</option>
                  <option ${a.kondisi === 'Broken' ? 'selected' : ''}>Broken</option>
                </select>
              </div>
              <button type="button" onclick="saveDrawerDemo('${esc(a.kode)}')" class="w-full py-2 rounded bg-[#2D4A94] text-white font-semibold cursor-pointer">Simpan Pembaruan Kondisi</button>
            </div>
          `}
        </div>

        <div class="p-3 border-t border-[var(--card-border)] flex items-center justify-between gap-2">
          <button type="button" onclick="openPrintSummary('${esc(a.kode)}')" class="flex-1 py-1.5 rounded border border-[var(--card-border)] font-medium cursor-pointer hover:bg-[var(--background)]">Cetak Rangkuman Detail Unit</button>
          <button type="button" onclick="closeDrawer()" class="px-3 py-1.5 rounded bg-[var(--background)] border border-[var(--card-border)] cursor-pointer">Tutup</button>
        </div>
      `;
    }

    function saveDrawerDemo(kode) {
      const a = PROTOTYPE_ASSETS.find(x => x.kode === kode);
      const val = document.getElementById('drawer-new-kond')?.value;
      if (a && val) {
        a.kondisi = val;
        renderDrawer();
        renderMain();
      }
    }

    function openPrintSummary(forceKode) {
      const list = forceKode
        ? PROTOTYPE_ASSETS.filter(a => a.kode === forceKode)
        : (state.selectedPrintCodes.size > 0
            ? PROTOTYPE_ASSETS.filter(a => state.selectedPrintCodes.has(a.kode))
            : getFilteredAssets().slice(0, 1));

      if (list.length === 0) return;
      document.getElementById('print-body').innerHTML = `
        <div class="flex items-start justify-between pb-3 border-b border-[var(--card-border)]">
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">PT PRATAMA NUSANTARA SAKTI &bull; RANGKUMAN DETAIL CETAK</div>
            <h3 class="text-base font-semibold mt-0.5">${list.length > 1 ? `Rangkuman Detail ${list.length} Unit Terpilih` : `Detail Unit: ${esc(list[0].nama)}`}</h3>
          </div>
          <div class="flex items-center gap-2 no-print">
            <button type="button" onclick="window.print()" class="px-3 py-1.5 rounded bg-[#2D4A94] text-white text-xs font-semibold cursor-pointer">Print / PDF</button>
            <button type="button" onclick="closePrintSummary()" class="px-3 py-1.5 rounded border border-[var(--card-border)] text-xs cursor-pointer">Tutup</button>
          </div>
        </div>
        <div class="space-y-4 mt-3 text-xs">
          ${list.map(u => `
            <div class="border border-[var(--card-border)] rounded p-3 space-y-2">
              <div class="flex justify-between font-semibold"><span>${esc(u.kode)} &bull; ${esc(u.nama)}</span><span>${esc(u.dept)} (${esc(u.section)})</span></div>
              <div class="grid grid-cols-5 gap-2 text-[11px] bg-[var(--background)] p-2 rounded">
                <div><span class="text-[var(--muted-foreground)] block">Perolehan</span><b>${esc(u.tglPerolehan)}</b></div>
                <div><span class="text-[var(--muted-foreground)] block">Umur</span><b>${u.umur} / ${u.stdUmur} thn</b></div>
                <div><span class="text-[var(--muted-foreground)] block">HPP</span><b>${formatRp(u.hpp)}</b></div>
                <div><span class="text-[var(--muted-foreground)] block">NBV</span><b>${formatRp(u.nbv)}</b></div>
                <div><span class="text-[var(--muted-foreground)] block">Total MTC</span><b>${formatRp(u.mtc)}</b></div>
              </div>
              <table class="w-full text-left border-collapse table-fixed border-t border-[var(--card-border)] text-[11px]">
                <thead><tr class="text-[var(--muted-foreground)]"><th class="py-1">Tgl &amp; BKB</th><th class="py-1">Sparepart</th><th class="py-1 text-right">Biaya</th></tr></thead>
                <tbody>
                  ${u.parts.map(pt => `<tr class="border-t border-[var(--card-border)]"><td class="py-1 font-mono">${esc(pt.tgl)} &bull; ${esc(pt.bukti)}</td><td class="py-1">${esc(pt.partName)} (${esc(pt.qty)})</td><td class="py-1 text-right font-mono">${formatRp(pt.biaya)}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('print-modal').classList.remove('hidden');
    }

    function closePrintSummary() {
      document.getElementById('print-modal').classList.add('hidden');
    }

    function renderAll() {
      renderSidebar();
      renderMain();
    }

    renderAll();
  </script>
</body>
</html>
